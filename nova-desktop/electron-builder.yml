appId: com.davebella.nova
productName: DaveBella
directories:
  output: release
  buildResources: assets
# Electron 二进制走国内镜像，避免每次打包从 GitHub 下载超时
# 下载 URL 会基于此 mirror 构造，缓存 key 也与之绑定，与本地已缓存的 zip 命中
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
files:
  - out/**/*
  - package.json
asar: true
# sql.js 通过 __dirname 读取同目录 wasm，必须从 asar 解包后才能被加载
asarUnpack:
  - node_modules/sql.js/dist/*.wasm
# 运行时主题切换需要两套图标，打包到 Resources/assets 供主进程读取
extraResources:
  - from: assets
    to: assets
    filter:
      - "icon.png"
      - "icon-light.png"
      - "icon.icns"
      - "icon-light.icns"
      - "icon.ico"
      - "icon-light.ico"
mac:
  icon: assets/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
  identity: null
  hardenedRuntime: false
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: DaveBella
