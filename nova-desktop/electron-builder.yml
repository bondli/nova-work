appId: com.davebella.nova
productName: DaveBella
directories:
  output: release
  buildResources: assets
files:
  - out/**/*
  - package.json
asar: true
# sql.js 通过 __dirname 读取同目录 wasm，必须从 asar 解包后才能被加载
asarUnpack:
  - node_modules/sql.js/dist/*.wasm
mac:
  icon: assets/icon.icns
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  identity: null
  hardenedRuntime: false
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: DaveBella
