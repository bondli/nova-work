<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />

<title>DaveBella 手机端 · 原型</title>

<style>
  body { background:#e9e9ee; display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px 16px; overflow:auto; }
  .phone {
    width:390px; height:min(844px, calc(100vh - 48px)); border-radius:54px; background:#111;
    padding:10px; box-shadow:0 30px 80px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.2) inset;
    flex-shrink:0;
  }
  .screen { width:100%; height:100%; border-radius:44px; overflow:hidden; background:#f4f4f5; position:relative; }
  .statusbar { height:44px; padding:12px 24px 0; display:flex; align-items:center; justify-content:space-between; font-size:12px; font-weight:600; }
  .content { height:calc(100% - 44px - 74px); overflow-y:auto; }
  .content.no-tabbar { height:calc(100% - 44px); }
  .tabbar { height:74px; background:#fff; border-top:1px solid #e4e4e7; display:flex; align-items:flex-start; padding:7px 4px 0; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:9px; color:#71717a; }
  .tab svg { width:19px; height:19px; }
  .tab.on { color:#4f46e5; font-weight:600; }
  .tabbar.hidden { display:none; }
  .appbar { height:52px; padding:0 16px; display:flex; align-items:center; gap:10px; background:#fff; border-bottom:1px solid #e4e4e7; }
  .sheet-mask { position:absolute; inset:0; background:rgba(0,0,0,.42); display:none; align-items:flex-end; z-index:40; }
  .sheet-mask.open { display:flex; }
  .sheet { width:100%; max-height:88%; background:#fff; border-radius:20px 20px 0 0; padding:8px 16px 24px; animation:up .2s ease-out; overflow-y:auto; }
  @keyframes up { from{ transform:translateY(100%);} to{transform:none;} }
  .pg { display:none; padding:14px 7px 16px; }
  .pg.on { display:block; }
  .mobile-card { background:#fff; border:1px solid #e4e4e7; border-radius:14px; }
  .home-bar { position:absolute; bottom:7px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#18181b; opacity:.8; pointer-events:none; z-index:60; }

  /* Tab 组：连体无间隙，浅灰底容器 + 选中白底浮起（与系统设置页一致） */
  .tabs { display:flex; padding:3px; border-radius:9px; background:#f4f4f5; gap:0; }
  .tabs button {
    flex:1; height:26px; border:1px solid transparent; border-radius:7px; background:transparent;
    font-size:12px; color:rgba(24,24,27,.6); transition:all .15s; display:flex; align-items:center; justify-content:center; gap:4px;
  }
  .tabs button.on { background:#fff; color:#18181b; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.08); }

  /* 居中弹窗 */
  .dialog-mask { position:absolute; inset:0; z-index:70; background:rgba(0,0,0,.42); display:none; align-items:center; justify-content:center; padding:24px; }
  .dialog-mask.open { display:flex; }
  .dialog { width:100%; background:#fff; border-radius:18px; padding:18px 16px 14px; animation:pop .16s ease-out; }
  @keyframes pop { from{ opacity:0; transform:scale(.96);} to{ opacity:1; transform:none;} }

  /* 扫码 */
  .scanner { position:absolute; inset:0; z-index:75; background:#0b0b0f; display:none; flex-direction:column; }
  .scanner.open { display:flex; }
  .scan-frame { position:relative; width:220px; height:220px; }
  .scan-corner { position:absolute; width:26px; height:26px; border:3px solid #fff; }
  .scan-line { position:absolute; left:8px; right:8px; height:2px; background:#4f46e5; box-shadow:0 0 12px 2px rgba(79,70,229,.8); animation:scan 2s linear infinite; }
  @keyframes scan { 0%{ top:12px; } 50%{ top:204px; } 100%{ top:12px; } }

  /* 启动页 */
  .splash { position:absolute; inset:0; z-index:100; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; transition:opacity .35s; }
  .splash.hide { opacity:0; pointer-events:none; }

  .subhead { display:flex; align-items:center; gap:8px; padding:12px 14px; background:#fff; border-bottom:1px solid #e4e4e7; }
</style>

  metric(label, value, delta) {
    const up = delta !== undefined && delta >= 0;
    const deltaHtml = delta === undefined ? '' :

  /** 状态标签 */
  tag(text, tone) { return `<span class="badge ${tone || ''}">${text}</span>`; },

  /** 搜索框（无右侧按钮） */

    return `<div class="relative">

        ${key === 'members' ? 'oninput="state.members.keyword=this.value"' : ''} />
    </div>`;

  /** Tab 组 */

    return `<div class="tabs">${items.map(t =>
      `<button class="${t.id === active ? 'on' : ''}" onclick="${handler}('${t.id}')">${t.label}</button>`

  /** 支付方式图标（圆形/方形色块 + 图标） */
  payIcon(id, size) {
    const p = PAYMENTS.find(x => x.id === id) || PAYMENTS[0];

    return `<span class="flex shrink-0 items-center justify-center rounded-[7px]" style="width:${s}px;height:${s}px;background:${p.soft};color:${p.color}">${icon(p.icon, 'h-3.5 w-3.5')}</span>`;

  },

  /** 空态 */
  empty(text) { return `<div class="py-10 text-center text-[11px] text-[#a1a1aa]">${text}</div>`; },

/* ============================================================

const pages = {

function renderTabbar() {
  const el = document.getElementById('tabbar');
  el.className = `tabbar${state.subpage ? ' hidden' : ''}`;
  el.innerHTML = TABS.map(t => `<button class="tab ${state.tab === t.id ? 'on' : ''}" onclick="goTab('${t.id}')">
    ${icon(t.icon)}<span>${t.label}</span>
  </button>`).join('');
}

function render() {
  if (!state.loggedIn) { renderLogin(); return; }
  document.getElementById('appbar').style.display = '';

  renderAppBar();
  renderTabbar();

  const content = document.getElementById('m-content');
  content.className = `content${state.subpage ? ' no-tabbar' : ''}`;
  content.innerHTML = state.subpage
    ? SUBPAGES[state.subpage].render(state.subpageParams)
    : pages[state.tab]();

  renderBuyBar();
  lucide.createIcons();
}

/* 买单底部结算条：只保留「去收款」 */
function renderBuyBar() {
  let bar = document.getElementById('buy-bar');
  const show = state.loggedIn && state.tab === 'buy' && !state.subpage;
  if (!show) { if (bar) bar.remove(); return; }
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'buy-bar';
    bar.className = 'absolute bottom-[74px] left-0 right-0 z-30 border-t border-[#e4e4e7] bg-white px-4 py-2.5';
    document.querySelector('.screen').appendChild(bar);
  }
  bar.innerHTML = `<button class="btn btn-primary h-10 w-full" onclick="openSheet('pay')">${icon('wallet','h-4 w-4')}去收款</button>`;
  lucide.createIcons();
}

/* ---------- 登录页 ---------- */
/** 复用启动页的 Logo 路径，避免重复维护 */
function brandSvg(size) {
  const path = document.querySelector('#splash svg path').getAttribute('d');

}

function loginHtml() {
  return `<div class="flex min-h-full flex-col justify-center px-6 pb-20">
    <div class="flex flex-col items-center">
      ${brandSvg(64)}

    </div>
    <div class="mt-8">
      <p class="mb-1 text-[11px] text-[#71717a]">用户名</p>
      <input id="login-username" class="input h-10 text-[13px]" placeholder="请输入员工账号" />
      <p class="mb-1 mt-3 text-[11px] text-[#71717a]">密码</p>
      <input id="login-password" type="password" class="input h-10 text-[13px]" placeholder="请输入密码"
        onkeydown="if(event.key==='Enter')submitLogin()" />
      <button class="mt-3 flex items-center gap-1 text-[11px] text-[#71717a]" onclick="toggleServerField()">
        <span id="login-caret">${icon('chevron-right','h-3.5 w-3.5')}</span>服务地址
      </button>
      <div id="login-server" class="mt-1 hidden">

        <p class="mt-1 text-[10px] text-[#a1a1aa]">真机需填写电脑的局域网 IP，端口默认 9577</p>
      </div>
      <p id="login-error" class="mt-2 hidden text-[11px] text-[#dc2626]">请输入用户名和密码</p>
      <button class="btn btn-primary mt-4 h-11 w-full text-[14px]" onclick="submitLogin()">登录</button>
    </div>
    <p class="mt-8 text-center text-[10px] text-[#a1a1aa]">演示账号：admin / admin</p>
  </div>`;
}

function renderLogin() {
  document.getElementById('appbar').style.display = 'none';
  document.getElementById('tabbar').className = 'tabbar hidden';
  const content = document.getElementById('m-content');
  content.className = 'content no-tabbar';
  content.innerHTML = loginHtml();
  renderBuyBar();
  lucide.createIcons();
}

function toggleServerField() {
  const opened = !document.getElementById('login-server').classList.toggle('hidden');
  document.getElementById('login-caret').innerHTML = icon(opened ? 'chevron-down' : 'chevron-right', 'h-3.5 w-3.5');
  lucide.createIcons();
}

function submitLogin() {
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;
  const error = document.getElementById('login-error');
  if (!username || !password) { error.classList.remove('hidden'); return; }
  state.loggedIn = true;
  state.userName = username;
  state.role = username === 'admin' ? 'admin' : 'clerk';
  state.tab = 'buy';
  render();
  showToast(`欢迎回来，${username}`);
}

function logout() {
  closeSheet();
  state.loggedIn = false;
  state.cart = [];
  state.member = null;
  state.subpage = null;
  render();
}

/* ---------- 导航 ---------- */
function goTab(id) {
  state.tab = id;
  state.subpage = null;
  render();
  document.getElementById('m-content').scrollTop = 0;
}

function openPage(name, params) {
  state.subpage = name;
  state.subpageParams = params || {};
  closeSheet();
  render();
  document.getElementById('m-content').scrollTop = 0;
}

function closePage() {
  state.subpage = null;
  render();
}

/* ---------- 抽屉 ---------- */
function openSheet(name, params) {
  state.sheet = name;
  document.getElementById('sheet').innerHTML = sheets[name](params || {});
  document.getElementById('sheet-mask').classList.add('open');
  lucide.createIcons();
}

function closeSheet() {
  state.sheet = null;
  document.getElementById('sheet-mask').classList.remove('open');
}

/* ---------- 弹窗 ---------- */
function openDialog(html) {
  document.getElementById('dialog').innerHTML = html;
  document.getElementById('dialog-mask').classList.add('open');
  lucide.createIcons();
}

function closeDialog() {
  document.getElementById('dialog-mask').classList.remove('open');
}

/* ---------- 订单 ---------- */
function switchOrderRange(id) { state.orders.range = id; state.orders.loaded = 1; render(); }
function submitOrderSearch(value) {
  state.orders.keyword = value.trim();
  if (!value.trim()) { state.orders.keyword = ''; render(); return; }
  const isPhone = /^1[3-9]\d{9}$/.test(value.trim());
  if (isPhone) { state.orders.keyword = value.trim(); showToast(`按手机号查询：${value.trim()}`); }
  else { state.orders.keyword = value.trim(); showToast(`按订单号查询：${value.trim()}`); }
}

/* ---------- 库存 ---------- */
function switchInventoryTab(id) {
  state.inventory.tab = id;
  state.inventory.keyword = '';
  render();
}

/* ---------- 会员 ---------- */
/* ---------- 数据 ---------- */
function switchDataRange(id) { state.data.range = id; render(); }
function switchLogRange() { showToast('已切换时间范围'); }
function noop() {}

/* ---------- 买单 ---------- */
const cartOriginal = () => state.cart.reduce((s, i) => s + i.price * i.qty, 0);
const cartPayable = () => state.cart.reduce((s, i) => s + i.price * i.discount / 10 * i.qty, 0);
const cartCount = () => state.cart.reduce((s, i) => s + i.qty, 0);

function changeQty(index, delta) {
  const item = state.cart[index];
  item.qty = Math.max(1, item.qty + delta);
  render();
}

function setDiscount(index, value) {
  const n = Number(value);
  state.cart[index].discount = (n > 0 && n <= 10) ? n : 6;
  render();
}

function openBarcodeDialog() { openSheet('barcodeInput'); }

function confirmBarcode() {
  const input = document.getElementById('barcode-input');
  const value = input.value.trim();
  const error = document.getElementById('barcode-error');
  const hit = MOCK.inventory.find(p => p.barcode === value);
  if (!hit) { error.classList.remove('hidden'); return; }
  const existing = state.cart.find(i => i.barcode === hit.barcode);
  if (existing) existing.qty += 1;
  else state.cart.push({ barcode: hit.barcode, name: hit.name, attr: hit.attr, price: hit.price, qty: 1, discount: 6 });
  closeSheet();
  showToast(`已加入买单：${hit.name}`);
  render();
}

function openMemberDialog() { openSheet('memberInput'); }

function confirmMember() {
  const input = document.getElementById('member-phone');
  const value = input.value.trim();
  const error = document.getElementById('member-error');
  if (!/^1[3-9]\d{9}$/.test(value)) { error.classList.remove('hidden'); return; }
  const hit = MOCK.members.find(m => m.phone === value);
  state.member = hit || { phone:value, name:'', kind:'platform', points:0, balance:0 };
  closeSheet();
  showToast(hit ? `已绑定会员 ${value}` : `未查询到会员 ${value}，已按新会员开单`);
  render();
}

function pickPayment(id) {
  state.payment = id;
  openSheet('pay');
}

function paySuccess() {
  const payment = PAYMENTS.find(p => p.id === state.payment) || PAYMENTS[0];
  state.receipt = {
    no: 'DB' + String(Date.now()).slice(-10),
    amount: cartPayable(),
    paymentLabel: payment.label,
    points: state.member ? Math.round(cartPayable()) : 0,
    balance: state.member ? state.member.balance : 0,
  };
  openSheet('paySuccess');
}

function continueOrder() {
  state.cart = [];
  state.member = null;
  state.note = '';
  state.receipt = null;
  closeSheet();
  state.tab = 'buy';
  render();
  showToast('已清空，可继续开单');
}

/* ---------- 扫码 ---------- */
let scanTimer;
function openScanner() {
  const el = document.getElementById('scanner');
  el.classList.add('open');
  el.innerHTML = `
    <div class="flex items-center justify-between px-4 pt-14 text-white">
      <button class="flex h-8 w-8 items-center justify-center rounded-lg bg-white/10" onclick="closeScanner()">${icon('x','h-5 w-5')}</button>
      <p class="text-[14px] font-medium">扫描商品条码</p>
      <span class="w-8"></span>
    </div>
    <div class="flex flex-1 flex-col items-center justify-center gap-6">
      <div class="scan-frame">
        <span class="scan-corner left-0 top-0 border-r-0 border-b-0 rounded-tl-md"></span>
        <span class="scan-corner right-0 top-0 border-l-0 border-b-0 rounded-tr-md"></span>
        <span class="scan-corner left-0 bottom-0 border-r-0 border-t-0 rounded-bl-md"></span>
        <span class="scan-corner right-0 bottom-0 border-l-0 border-t-0 rounded-br-md"></span>
        <span class="scan-line"></span>
      </div>
      <p class="text-[12px] text-white/70">将商品条码放入框内，自动识别</p>
    </div>
    <div class="pb-16 text-center">
      <button class="btn h-10 px-6" onclick="simulateScan()">模拟识别</button>
    </div>`;
  lucide.createIcons();
  scanTimer = setTimeout(simulateScan, 1500);
}

function closeScanner() {
  clearTimeout(scanTimer);
  document.getElementById('scanner').classList.remove('open');
}

function simulateScan() {
  clearTimeout(scanTimer);
  const barcode = '6941496198229';
  closeScanner();
  const hit = MOCK.inventory.find(p => p.barcode === barcode);
  openDialog(`
    <div class="text-center">
      <span class="mx-auto flex h-11 w-11 items-center justify-center rounded-full bg-[#eef2ff] text-[#4f46e5]">${icon('scan-barcode','h-5 w-5')}</span>
      <p class="mt-2 text-[14px] font-semibold">已识别条码</p>
      <p class="mt-1 text-[13px] tnum text-[#52525b]">${barcode}</p>
      ${hit ? `<p class="mt-2 text-[12px] text-[#71717a]">${hit.name} · ${hit.attr}</p>` : ''}
    </div>
    <div class="mt-4 grid grid-cols-2 gap-2">
      <button class="btn h-10" onclick="scanAction('inventory','${barcode}')">查询库存</button>
      <button class="btn btn-primary h-10" onclick="scanAction('buy','${barcode}')">加入买单</button>
    </div>
    <button class="btn btn-ghost mt-2 w-full text-[12px]" onclick="closeDialog()">取消</button>`);
}

function scanAction(action, barcode) {
  closeDialog();
  const hit = MOCK.inventory.find(p => p.barcode === barcode);
  if (action === 'buy') {
    if (!hit) { showToast('未查询到该条码'); return; }
    const existing = state.cart.find(i => i.barcode === hit.barcode);
    if (existing) existing.qty += 1;
    else state.cart.push({ barcode: hit.barcode, name: hit.name, attr: hit.attr, price: hit.price, qty: 1, discount: 6 });
    goTab('buy');
    showToast(`已加入买单：${hit.name}`);
    return;
  }
  state.tab = 'inventory';
  state.inventory.keyword = barcode;
  state.inventory.tab = 'all';
  state.subpage = null;
  render();
  showToast(`已按条码查询：${barcode}`);
}

/* ---------- Toast ---------- */
let toastTimer;
function showToast(text) {
  const el = document.getElementById('toast');
  document.getElementById('toast-text').textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
}

/* ---------- 触底加载更多 ---------- */
document.getElementById('m-content').addEventListener('scroll', function () {
  if (state.tab !== 'orders' || state.subpage) return;
  const nearBottom = this.scrollTop + this.clientHeight >= this.scrollHeight - 40;
  if (!nearBottom) return;
  if (state.orders.loaded >= 3) return;
  state.orders.loaded += 1;
  render();
  this.scrollTop = this.scrollHeight - this.clientHeight - 60;
});

/* ---------- 初始化 ---------- */
render();
setTimeout(() => document.getElementById('splash').classList.add('hide'), 1200);
</script>
