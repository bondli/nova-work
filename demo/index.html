<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nova · DaveBella 产品原型</title>
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --brand:#4f46e5; --border:#e4e4e7; --fg:#18181b; --muted:#71717a; --bg:#f4f4f5;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; font-family:Inter,-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#f4f4f5; color:var(--fg); overflow:hidden; }
  .shell { height:100vh; display:flex; flex-direction:column; }
  .topbar {
    height:58px; flex-shrink:0; background:#fff; border-bottom:1px solid var(--border);
    display:flex; align-items:center; gap:18px; padding:0 18px;
  }
  .logo { width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,#6366f1,#312e81); display:flex; align-items:center; justify-content:center; color:#fff; flex-shrink:0; }
  .logo svg { width:18px; height:18px; }
  .brand-name { font-size:14px; font-weight:600; letter-spacing:-.01em; line-height:1.15; }
  .brand-sub { font-size:10px; color:var(--muted); margin-top:1px; }
  .nav { display:flex; align-items:center; gap:2px; background:#f4f4f5; padding:3px; border-radius:10px; }
  .nav button {
    height:30px; padding:0 13px; border:0; border-radius:8px; background:transparent;
    font-size:12px; color:#52525b; cursor:pointer; display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .nav button svg { width:14px; height:14px; }
  .nav button:hover { color:#18181b; }
  .nav button.on { background:#fff; color:#18181b; font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.07); }
  .nav button.on svg { color:var(--brand); }
  .spacer { flex:1; }
  .hint { font-size:11px; color:var(--muted); display:flex; align-items:center; gap:5px; }
  .hint svg { width:13px; height:13px; }
  .frame-wrap { flex:1; position:relative; background:#e9e9ee; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; display:none; background:#f4f4f5; }
  iframe.on { display:block; }
  @media (max-width: 1080px) {
    .hint { display:none; }
    .nav button { padding:0 10px; font-size:11px; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="logo"><i data-lucide="sparkles"></i></div>
    <div>
      <div class="brand-name">Nova 产品原型</div>
      <div class="brand-sub">DaveBella · 懂我，帮我的经营伙伴</div>
    </div>
    <div class="nav" id="nav">
      <button class="on" data-key="desktop" data-file="desktop.html"><i data-lucide="monitor"></i>桌面端</button>
      <button data-key="mobile" data-file="mobile.html"><i data-lucide="smartphone"></i>手机端</button>
      <button data-key="extension" data-file="extension.html"><i data-lucide="chrome"></i>浏览器插件</button>
      <button data-key="miniapp" data-file="miniapp.html"><i data-lucide="message-circle"></i>会员小程序</button>
    </div>
    <div class="spacer"></div>
    <div class="hint"><i data-lucide="mouse-pointer-2"></i>均可点击交互 · 原型数据为演示值</div>
  </div>
  <div class="frame-wrap" id="frame-wrap">
    <iframe id="frame-desktop" data-src="desktop.html" class="on"></iframe>
    <iframe id="frame-mobile" data-src="mobile.html"></iframe>
    <iframe id="frame-extension" data-src="extension.html"></iframe>
    <iframe id="frame-miniapp" data-src="miniapp.html"></iframe>
  </div>
</div>
<script>
  const frames = {
    desktop: document.getElementById('frame-desktop'),
    mobile: document.getElementById('frame-mobile'),
    extension: document.getElementById('frame-extension'),
    miniapp: document.getElementById('frame-miniapp'),
  };
  let current = 'desktop';

  function load(key){
    const f = frames[key];
    if (!f.src) f.src = f.dataset.src;
  }

  function select(key){
    Object.entries(frames).forEach(([k, f]) => f.classList.toggle('on', k === key));
    document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.key === key));
    load(key);
    current = key;
  }

  document.getElementById('nav').addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    select(btn.dataset.key);
  });

  load(current);

  if (window.lucide) lucide.createIcons();
</script>
</body>
</html>
