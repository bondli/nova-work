<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DaveBella 会员小程序 · 原型</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./demo.css" />
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
  body { background:#e9e9ee; display:flex; align-items:center; justify-content:center; min-height:100vh; overflow:auto; }
  .phone {
    width:390px; height:844px; border-radius:54px; background:#111; padding:10px;
    box-shadow:0 30px 80px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.2) inset;
    flex-shrink:0;
  }
  .screen { width:100%; height:100%; border-radius:44px; overflow:hidden; background:#f4f4f5; position:relative; display:flex; flex-direction:column; }
  .statusbar { height:44px; padding:12px 24px 0; display:flex; align-items:center; justify-content:space-between; font-size:12px; font-weight:600; background:#fff; flex-shrink:0; }
  .mp-head { height:46px; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 12px 0 16px; flex-shrink:0; }
  .capsule { display:flex; align-items:center; gap:0; height:30px; border:1px solid #e4e4e7; border-radius:999px; overflow:hidden; background:#fff; }
  .capsule button { width:40px; height:30px; display:flex; align-items:center; justify-content:center; background:transparent; border:0; color:#18181b; cursor:pointer; }
  .capsule .divider { width:1px; height:16px; background:#e4e4e7; }
  .content { flex:1; overflow-y:auto; }
  .pg { display:none; padding:14px 14px 24px; }
  .pg.on { display:block; }
  .mp-card { background:#fff; border:1px solid #e4e4e7; border-radius:16px; }
  .tabbar { height:64px; background:#fff; border-top:1px solid #e4e4e7; display:flex; align-items:center; padding:0 4px 6px; flex-shrink:0; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:9px; color:#a1a1aa; cursor:pointer; }
  .tab svg { width:20px; height:20px; }
  .tab.on { color:#4f46e5; font-weight:600; }
  .sheet-mask { position:absolute; inset:0; background:rgba(0,0,0,.42); display:none; align-items:flex-end; z-index:40; }
  .sheet-mask.open { display:flex; }
  .sheet { width:100%; background:#fff; border-radius:20px 20px 0 0; padding:10px 16px 26px; animation:up .2s ease-out; max-height:78%; overflow:auto; }
  @keyframes up { from{ transform:translateY(100%);} to{transform:none;} }
  .home-bar { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#18181b; opacity:.85; z-index:50; }
  .member-card {
    position:relative; overflow:hidden; border-radius:18px; padding:18px 18px 16px; color:#fff;
    background:linear-gradient(135deg,#4f46e5 0%,#312e81 62%,#1e1b4b 100%);
    box-shadow:0 10px 26px rgba(79,70,229,.30);
  }
  .member-card::after {
    content:""; position:absolute; right:-42px; top:-52px; width:180px; height:180px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), rgba(255,255,255,0) 70%);
  }
  .quick { display:flex; flex-direction:column; align-items:center; gap:6px; font-size:11px; color:#3f3f46; }
  .quick-ico { width:42px; height:42px; border-radius:13px; display:flex; align-items:center; justify-content:center; background:#eef2ff; color:#4f46e5; }
  .row { display:flex; align-items:center; justify-content:space-between; padding:13px 14px; border-bottom:1px solid #f4f4f5; }
  .row:last-child { border-bottom:0; }
  .amount-plus { color:#16a34a; font-weight:600; }
  .amount-minus { color:#18181b; font-weight:600; }
</style>
</head>
<body>
<div class="flex items-center gap-10">
  <div class="hidden max-w-[300px] lg:block">
    <p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-[#4f46e5]">MINIAPP · MEMBER SELF-SERVICE</p>
    <h1 class="mt-2 text-[26px] font-semibold tracking-tight">会员自助查询</h1>
    <p class="mt-2 text-[13px] leading-relaxed text-[#52525b]">微信授权登录 + 手机号绑定；查订单、积分、余额、优惠券与活动。仅查不改，金额与积分以服务端为准。</p>
    <div class="mt-5 space-y-2 text-[12px] text-[#71717a]">
      <p class="flex items-center gap-2"><i data-lucide="shield-check" class="h-4 w-4"></i>不返回成本、毛利、导购等敏感字段</p>

    </div>

  <div class="phone">
    <div class="screen">
      <div class="statusbar">
        <span>9:41</span>
        <div class="flex items-center gap-1.5 text-[#18181b]">
          <i data-lucide="signal" class="h-3.5 w-3.5"></i>

        <div class="capsule">
          <button title="更多" onclick="showToast('已加入我的小程序')"><i data-lucide="more-horizontal" class="h-4 w-4"></i></button>
          <span class="divider"></span>
          <button title="关闭" onclick="showToast('已退出小程序（原型）')"><i data-lucide="circle-dot" class="h-4 w-4"></i></button>
        </div>
      </div>

      <div id="mp-content" class="content"></div>

      <div class="tabbar" id="mp-tabbar"></div>
      <div class="home-bar"></div>

      <div id="mp-sheet-mask" class="sheet-mask" onclick="if(event.target===this)closeSheet()">
        <div id="mp-sheet" class="sheet"></div>
      </div>
    </div>
  </div>
</div>

/* ------- 通用 ------- */
function openSheet(html){
  document.getElementById('mp-sheet').innerHTML = html;
  document.getElementById('mp-sheet-mask').classList.add('open');
  lucide.createIcons();
}
function closeSheet(){ document.getElementById('mp-sheet-mask').classList.remove('open'); }

function showToast(msg){
  let t = document.getElementById('mp-toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'mp-toast';
    t.style.cssText = 'position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(6px);background:rgba(24,24,27,.94);color:#fff;font-size:12px;padding:9px 14px;border-radius:9px;z-index:80;opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap;';
    document.querySelector('.screen').appendChild(t);
  }
  t.textContent = msg;
  requestAnimationFrame(()=>{ t.style.opacity='1'; t.style.transform='translateX(-50%)'; });
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.opacity='0'; t.style.transform='translateX(-50%) translateY(6px)'; }, 2000);
}

function renderTabbar(){
  document.getElementById('mp-tabbar').innerHTML = TABS.map(t=>`
    <button class="tab ${state.tab===t.id?'on':''}" onclick="goTab('${t.id}')">
      <i data-lucide="${t.icon}"></i><span>${t.label}</span>
    </button>
  `).join('');
}

const PAGES = { home:homePage, orders:ordersPage, points:pointsPage, balance:balancePage, profile:profilePage };

function goTab(id){
  state.tab = id;
  document.getElementById('mp-title').textContent = TITLES[id] || 'DaveBella 会员';
  document.getElementById('mp-content').innerHTML = PAGES[id]();
  document.getElementById('mp-content').scrollTop = 0;
  renderTabbar();
  lucide.createIcons();
}

goTab('home');
</script>
