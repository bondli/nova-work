<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DaveBella 会员小程序 · 新版原型</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./demo.css" />
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
<style>
  body { background:#e9e9ee; display:flex; align-items:center; justify-content:center; min-height:100vh; overflow:auto; }
  .phone {
    width:390px; height:844px; border-radius:54px; background:#111; padding:10px;
    box-shadow:0 30px 80px rgba(0,0,0,.28), 0 0 0 1px rgba(255,255,255,.2) inset;
    flex-shrink:0;
  }
  .screen { width:100%; height:100%; border-radius:44px; overflow:hidden; background:#f4f4f5; position:relative; display:flex; flex-direction:column; }
  .statusbar { height:44px; padding:12px 24px 0; display:flex; align-items:center; justify-content:space-between; font-size:12px; font-weight:600; background:#fff; flex-shrink:0; }
  .mp-head { height:46px; background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 12px 0 16px; flex-shrink:0; border-bottom:1px solid #f4f4f5; }
  .capsule { display:flex; align-items:center; height:30px; border:1px solid #e4e4e7; border-radius:999px; overflow:hidden; background:#fff; }
  .capsule button { width:40px; height:30px; display:flex; align-items:center; justify-content:center; background:transparent; border:0; color:#18181b; cursor:pointer; }
  .capsule .divider { width:1px; height:16px; background:#e4e4e7; }
  .content { flex:1; overflow-y:auto; overscroll-behavior:contain; }
  .pg { display:none; padding:14px 14px 24px; }
  .pg.on { display:block; }
  .mp-card { background:#fff; border:1px solid #e4e4e7; border-radius:16px; }
  .tabbar { height:64px; background:#fff; border-top:1px solid #e4e4e7; display:flex; align-items:center; padding:0 10px 6px; flex-shrink:0; }
  .tab { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:10px; color:#a1a1aa; cursor:pointer; background:none; border:0; }
  .tab svg { width:21px; height:21px; }
  .tab.on { color:#ff0f23; font-weight:600; }
  .sheet-mask { position:absolute; inset:0; background:rgba(0,0,0,.42); display:none; align-items:flex-end; z-index:40; }
  .sheet-mask.open { display:flex; }
  .sheet { width:100%; background:#fff; border-radius:22px 22px 0 0; padding:10px 16px 26px; animation:up .22s ease-out; max-height:82%; overflow:auto; }
  @keyframes up { from{ transform:translateY(100%);} to{transform:none;} }
  .home-bar { position:absolute; bottom:6px; left:50%; transform:translateX(-50%); width:134px; height:5px; border-radius:3px; background:#18181b; opacity:.85; z-index:50; pointer-events:none; }
  .brand-mark { font-family: Georgia, "Times New Roman", serif; letter-spacing:.02em; }
  .hero { position:relative; height:330px; border-radius:20px; overflow:hidden; background:#b30012; }
  .hero img { width:100%; height:100%; object-fit:cover; }
  .hero::after { content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(30,27,75,.10) 0%, rgba(30,27,75,.06) 38%, rgba(30,27,75,.78) 100%); }
  .hero-body { position:absolute; inset:0; z-index:2; padding:16px; display:flex; flex-direction:column; justify-content:space-between; color:#fff; }
  .glass { background:rgba(255,255,255,.16); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.26); }
  .login-pill { display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 11px; border-radius:999px; font-size:11px; font-weight:600; color:#fff; cursor:pointer; }
  .section-head { display:flex; align-items:center; justify-content:space-between; margin:18px 2px 8px; }
  .section-title { font-size:14px; font-weight:600; letter-spacing:-.01em; }
  .section-more { font-size:11px; color:#71717a; background:none; border:0; cursor:pointer; display:flex; align-items:center; gap:2px; }
  .hscroll { display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; margin:0 -14px; padding-left:14px; padding-right:14px; }
  .hscroll::-webkit-scrollbar { display:none; }
  .prod { width:132px; flex-shrink:0; background:#fff; border:1px solid #e4e4e7; border-radius:14px; overflow:hidden; }
  .prod-img { height:150px; background:#f4f4f5; overflow:hidden; }
  .prod-img img { width:100%; height:100%; object-fit:cover; }
  .prod-img, .store-img { position:relative; }
  .img-fb { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#fff1f2,#ffe0e5); color:#ff4057; font-family:Georgia, "Times New Roman", serif; letter-spacing:.12em; font-size:11px; }
  .chip { display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:5px 10px; font-size:11px; background:#fff; border:1px solid #e4e4e7; color:#3f3f46; white-space:nowrap; cursor:pointer; }
  .chip.on { background:#ff0f23; border-color:#ff0f23; color:#fff; }
  .feature { display:flex; flex-direction:column; gap:7px; padding:12px; }
  .feature-ico { width:34px; height:34px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:#fff1f2; color:#ff0f23; }
  .member-card {
    position:relative; overflow:hidden; border-radius:18px; padding:18px; color:#fff;
    background:linear-gradient(135deg,#ff0f23 0%,#d70015 58%,#7f0010 100%);
    box-shadow:0 10px 26px rgba(79,70,229,.28);
  }
  .member-card::after {
    content:""; position:absolute; right:-42px; top:-52px; width:180px; height:180px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.22), rgba(255,255,255,0) 70%);
  }
  .quick { display:flex; flex-direction:column; align-items:center; gap:7px; font-size:11px; color:#3f3f46; background:none; border:0; cursor:pointer; padding:8px 0; }
  .quick-ico { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:#fff1f2; color:#ff0f23; }
  .row { display:flex; align-items:center; justify-content:space-between; padding:13px 14px; border-bottom:1px solid #f4f4f5; width:100%; background:none; border-left:0; border-right:0; border-top:0; text-align:left; cursor:pointer; }
  .row:last-child { border-bottom:0; }
  .amount-plus { color:#16a34a; font-weight:600; }
  .amount-minus { color:#18181b; font-weight:600; }
  .lock-wrap { display:flex; flex-direction:column; align-items:center; text-align:center; padding:34px 22px 24px; }
  .lock-ico { width:64px; height:64px; border-radius:20px; background:#fff1f2; color:#ff0f23; display:flex; align-items:center; justify-content:center; }
  .benefit { display:flex; align-items:center; gap:10px; width:100%; padding:11px 12px; border-radius:12px; background:#fafafa; text-align:left; }
  .benefit-ico { width:30px; height:30px; border-radius:9px; background:#fff1f2; color:#ff0f23; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .sign-day { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; }
  .sign-dot { width:30px; height:30px; border-radius:999px; display:flex; align-items:center; justify-content:center; background:#f4f4f5; color:#a1a1aa; font-size:11px; font-weight:600; }
  .sign-dot.done { background:#fff1f2; color:#ff0f23; }
  .sign-dot.today { background:#ff0f23; color:#fff; box-shadow:0 0 0 4px #fff1f2; }
  .lottery-card { position:relative; overflow:hidden; border-radius:18px; padding:16px; background:linear-gradient(135deg,#ff6a3d 0%,#ff2318 52%,#d70015 100%); color:#fff; box-shadow:0 10px 24px rgba(255,15,35,.22); }
  .lottery-card::after { content:""; position:absolute; width:190px; height:190px; right:-60px; bottom:-90px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.25),rgba(255,255,255,0) 70%); }
  .prize-chip { padding:5px 9px; border-radius:999px; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.28); font-size:10px; white-space:nowrap; }
  .coupon { display:flex; overflow:hidden; border-radius:14px; border:1px solid #ffe0e5; background:#fff; }
  .coupon-left { width:78px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#fff1f2; color:#c7001a; }
  .coupon-left.off { background:#f4f4f5; color:#a1a1aa; }
  .stock-bar { height:4px; border-radius:2px; background:#f4f4f5; overflow:hidden; }
  .stock-bar > span { display:block; height:100%; background:#ff0f23; }
  .btn-primary { background:#ff0f23; border-color:#ff0f23; color:#fff; }
  .btn-primary:hover { background:#d70015; }

  /* 首页顶部品牌条（免登录，只放品牌与登录入口） */
  .brand-top { display:flex; align-items:center; justify-content:space-between; padding:2px 2px 10px; }
  .brand-top .logo { font-family:Georgia,"Times New Roman",serif; font-size:19px; font-weight:600; letter-spacing:.01em; }
  .brand-top .tagline { margin-top:2px; font-size:9px; letter-spacing:.2em; color:#ff0f23; text-transform:uppercase; }
  .login-btn { display:inline-flex; align-items:center; gap:5px; height:28px; padding:0 11px; border-radius:999px; border:1px solid #ffe0e5; background:#fff1f2; color:#c7001a; font-size:11px; font-weight:600; cursor:pointer; }

  /* ① 活动 banner */
  .banner { position:relative; width:272px; height:152px; flex-shrink:0; border-radius:16px; overflow:hidden; cursor:pointer; }
  .banner img { width:100%; height:100%; object-fit:cover; }
  .banner-shade { position:absolute; inset:0; background:linear-gradient(90deg,rgba(127,0,16,.86) 0%,rgba(199,0,26,.55) 52%,rgba(199,0,26,.12) 100%); }
  .banner-body { position:absolute; inset:0; padding:14px; display:flex; flex-direction:column; justify-content:space-between; color:#fff; }
  .banner-tag { align-self:flex-start; padding:3px 7px; border-radius:6px; background:rgba(255,255,255,.2); border:1px solid rgba(255,255,255,.3); font-size:9px; letter-spacing:.08em; }
  .banner-title { font-size:17px; font-weight:600; line-height:1.24; letter-spacing:-.01em; text-shadow:0 1px 8px rgba(0,0,0,.18); }
  .banner-desc { margin-top:4px; font-size:10px; color:rgba(255,255,255,.82); }
  .banner-cta { display:inline-flex; align-items:center; gap:2px; align-self:flex-start; margin-top:8px; padding:4px 9px; border-radius:999px; background:#fff; color:#c7001a; font-size:10px; font-weight:600; }
  .banner-dots { display:flex; justify-content:center; gap:5px; margin-top:8px; }
  .banner-dot { width:5px; height:5px; border-radius:999px; background:#e4e4e7; }
  .banner-dot.on { width:14px; background:#ff0f23; }

  /* 活动详情页 */
  .act-hero { position:relative; height:190px; border-radius:18px; overflow:hidden; background:linear-gradient(135deg,#ff6a3d,#d70015 60%,#7f0010); }
  .act-hero img { width:100%; height:100%; object-fit:cover; }
  .act-hero-shade { position:absolute; inset:0; background:linear-gradient(180deg,rgba(127,0,16,.06) 0%,rgba(127,0,16,.82) 100%); }
  .act-hero-body { position:absolute; inset:0; padding:14px; display:flex; flex-direction:column; justify-content:space-between; color:#fff; }
  .act-hero-title { font-size:18px; font-weight:600; line-height:1.28; letter-spacing:-.01em; }
  .act-hero-desc { margin-top:4px; font-size:10px; color:rgba(255,255,255,.85); }
  .act-row { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; font-size:11px; }
  .act-row + .act-row { margin-top:8px; }
  .act-row span:first-child { flex-shrink:0; color:#a1a1aa; }
  .act-row span:last-child { text-align:right; color:#18181b; }
  .act-rule { margin-top:10px; padding-top:9px; border-top:1px solid #f4f4f5; font-size:10px; line-height:1.7; color:#71717a; }
  .act-coupon { display:flex; overflow:hidden; border-radius:14px; border:1px solid #ffe0e5; background:#fff; }
  .act-coupon-left { width:82px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#fff1f2; color:#c7001a; }
  .act-coupon-left b { font-size:22px; line-height:1; font-variant-numeric:tabular-nums; }
  .act-coupon-left small { margin-top:3px; font-size:9px; }
  .act-coupon-off .act-coupon-left { background:#f4f4f5; color:#a1a1aa; }
  .act-claim { width:66px; height:28px; padding:0; border-radius:999px; border:1px solid #ff0f23; background:#ff0f23; color:#fff; font-size:11px; font-weight:600; cursor:pointer; }
  .act-claim:disabled { border-color:#e4e4e7; background:#f4f4f5; color:#a1a1aa; cursor:default; }

  /* ② 主营类目 */
  .cat-tile { display:flex; flex-direction:column; gap:1px; background:#fff; border:1px solid #e4e4e7; border-radius:13px; overflow:hidden; padding:0 0 7px; cursor:pointer; text-align:left; }
  .cat-img { height:104px; background:#f4f4f5; overflow:hidden; position:relative; margin-bottom:6px; }
  .cat-img img { width:100%; height:100%; object-fit:cover; }
  .cat-tile p { padding:0 8px; }

  /* ③ 品牌价值 */
  .brand-img { height:118px; background:#f4f4f5; overflow:hidden; position:relative; }
  .brand-img img { width:100%; height:100%; object-fit:cover; }
  .brand-stat { display:flex; flex-direction:column; gap:1px; }
  .brand-stat b { font-size:13px; font-weight:600; color:#c7001a; }
  .brand-stat span { font-size:9px; color:#a1a1aa; }

  /* 积分兑换 */
  .redeem-card { display:flex; gap:10px; background:#fff; border:1px solid #e4e4e7; border-radius:14px; padding:10px; }
  .redeem-img { width:76px; height:76px; flex-shrink:0; border-radius:10px; overflow:hidden; background:#f4f4f5; position:relative; }
  .redeem-img img { width:100%; height:100%; object-fit:cover; }
  .code-box { display:flex; flex-direction:column; align-items:center; padding:16px; border-radius:14px; background:linear-gradient(135deg,#fff1f2,#ffe0e5); border:1px dashed #ff8a99; }
  .code-digits { margin-top:6px; font-size:30px; font-weight:700; letter-spacing:.22em; color:#c7001a; }

  .fade-in { animation:fade .18s ease-out; }
  @keyframes fade { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
  .tnum { font-variant-numeric: tabular-nums; }

  /* 子页面返回按钮（抽奖页 / 资料修改页） */
  .mp-back { width:28px; height:28px; display:none; align-items:center; justify-content:center; border:0; border-radius:999px; background:transparent; color:#18181b; cursor:pointer; flex-shrink:0; }
  .mp-back:active { background:#f4f4f5; }

  /* 抽奖页：大转盘 */
  .wheel-wrap { position:relative; width:280px; height:280px; margin:0 auto; }
  .wheel { position:absolute; inset:0; border-radius:50%; border:6px solid #fff; box-shadow:0 10px 30px rgba(199,0,26,.16), 0 0 0 1px #ffe0e5; overflow:hidden; transition:transform 4s cubic-bezier(.16,.72,.18,1); }
  .wheel-face { position:absolute; inset:0; background:conic-gradient(from -30deg, #fff1f2 0 60deg, #ffffff 60deg 120deg, #fff1f2 120deg 180deg, #ffffff 180deg 240deg, #fff1f2 240deg 300deg, #ffffff 300deg 360deg); }
  .wheel-line { position:absolute; left:50%; top:0; width:1px; height:50%; background:#ffe0e5; transform-origin:bottom center; }
  .wheel-text { position:absolute; width:64px; text-align:center; font-size:10px; font-weight:600; color:#52525b; line-height:1.25; transform:translate(-50%,-50%); }
  .wheel-pointer { position:absolute; left:50%; top:-10px; transform:translateX(-50%); width:0; height:0; border-left:9px solid transparent; border-right:9px solid transparent; border-top:15px solid #ff0f23; filter:drop-shadow(0 2px 3px rgba(0,0,0,.15)); z-index:3; }
  .wheel-btn { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:78px; height:78px; border-radius:50%; border:5px solid #fff; background:linear-gradient(135deg,#ff6a3d,#ff0f23 55%,#c7001a); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; box-shadow:0 8px 20px rgba(199,0,26,.36); cursor:pointer; z-index:4; }
  .wheel-btn:disabled { opacity:.72; cursor:not-allowed; }

  /* 资料修改表单 */
  .field { width:100%; height:42px; padding:0 12px; border:1px solid #e4e4e7; border-radius:10px; background:#fff; font-size:13px; color:#18181b; outline:none; }
  .field:focus { border-color:#ff0f23; box-shadow:0 0 0 3px rgba(255,15,35,.1); }
  .field[readonly] { background:#fafafa; color:#a1a1aa; }
</style>
</head>
<body>
<div class="flex items-center gap-10">
  <div class="hidden max-w-[300px] lg:block">
    <p class="text-[11px] font-semibold uppercase tracking-[0.18em] text-[#ff0f23]">MINIAPP · MEMBER SELF-SERVICE</p>
    <h1 class="mt-2 text-[26px] font-semibold tracking-tight">会员小程序 · 新版</h1>
    <p class="mt-2 text-[13px] leading-relaxed text-[#52525b]">首页对外传递品牌与门店产品力，免登录浏览；发现与我的需微信授权手机号登录，手机号即门店会员号。</p>
    <div class="mt-5 space-y-2 text-[12px] text-[#71717a]">
      <p class="flex items-center gap-2"><i data-lucide="home" class="h-4 w-4"></i>首页：活动 banner / 主营类目 / 品牌价值 / 门店</p>
      <p class="flex items-center gap-2"><i data-lucide="gift" class="h-4 w-4"></i>发现：签到积分 / 积分抽奖 / 积分兑换</p>
      <p class="flex items-center gap-2"><i data-lucide="user-round" class="h-4 w-4"></i>我的：资产 / 订单 / 流水 / 兑换 / 余额</p>
    </div>
    <div class="mt-6 rounded-xl border border-[#e4e4e7] bg-white p-3 text-[12px] text-[#52525b]">
      <p class="font-medium text-[#18181b]">交互提示</p>
      <p class="mt-1 leading-relaxed">点击底部 Tab 切换；未登录访问「发现」「我的」会展示登录引导；点击「微信授权手机号」可模拟登录并解锁全部会员功能。</p>
    </div>
    <p class="mt-6 text-[11px] text-[#a1a1aa]">演示数据仅用于原型评审，金额与积分以服务端为准。</p>
  </div>

  <div class="phone">
    <div class="screen">
      <div class="statusbar">
        <span>9:41</span>
        <div class="flex items-center gap-1.5 text-[#18181b]">
          <i data-lucide="signal" class="h-3.5 w-3.5"></i>
          <i data-lucide="wifi" class="h-3.5 w-3.5"></i>
          <i data-lucide="battery-full" class="h-4 w-4"></i>
        </div>
      </div>

      <div class="mp-head">
        <div class="flex min-w-0 items-center gap-1">
          <button id="mp-back" title="返回" onclick="closeSubPage()" style="display:none" class="mp-back"><i data-lucide="chevron-left" class="h-4 w-4"></i></button>
          <p id="mp-title" class="text-[15px] font-semibold">Dave & Bella</p>
        </div>
        <div class="capsule">
          <button title="更多" onclick="showToast('已加入我的小程序')"><i data-lucide="more-horizontal" class="h-4 w-4"></i></button>
          <span class="divider"></span>
          <button title="关闭" onclick="showToast('已退出小程序（原型）')"><i data-lucide="circle-dot" class="h-4 w-4"></i></button>
        </div>
      </div>

      <div id="mp-content" class="content"></div>

      <div class="tabbar" id="mp-tabbar"></div>
      <div class="home-bar"></div>

      <div id="mp-sheet-mask" class="sheet-mask" onclick="if(event.target===this)closeSheet()">
        <div id="mp-sheet" class="sheet"></div>
      </div>
    </div>
  </div>
</div>

<script>
/* ========== 原型数据 ========== */
// 图片统一走生成接口；prompt 在运行时编码，避免手写长 URL
const imgUrl = (prompt, size = 'square') =>
  `https://trae-api-cn.mchost.guru/api/ide/v1/tool_text_to_image?prompt=${encodeURIComponent(prompt)}&image_size=${size}`;

const IMG = {
  banner1: imgUrl('Editorial campaign photograph of two happy young children wearing warm red and cream winter puffer jackets, standing against a warm crimson studio backdrop with soft light, premium Chinese kidswear brand campaign, joyful winter mood, no text, no logo', 'landscape_16_9'),
  banner2: imgUrl('Warm flat lay of children clothing and gifts, red knitted sweater, cream scarf, wooden toy and gift box on a soft beige background, premium kidswear promotion, cozy winter palette, no text', 'landscape_16_9'),
  cat1: imgUrl('Portrait photograph of a little girl wearing a soft pink hooded puffer jacket standing outdoors in winter, natural light, premium Chinese childrens clothing catalog, warm neutral background, no text', 'portrait_4_3'),
  cat2: imgUrl('Portrait photograph of a little boy with curly hair wearing a camel brown hooded puffer jacket outdoors, natural winter light, premium childrens clothing catalog, warm neutral background, no text', 'portrait_4_3'),
  cat3: imgUrl('Portrait photograph of an older girl wearing a light lavender padded winter jacket, soft studio light, premium childrens clothing catalog, warm neutral background, no text', 'portrait_4_3'),
  cat4: imgUrl('Portrait photograph of an older boy wearing a black winter jacket over a plaid shirt, natural outdoor light, premium childrens clothing catalog, warm neutral background, no text', 'portrait_4_3'),
  cat5: imgUrl('Portrait photograph of a baby wearing a light blue hooded puffer suit with cute ears, soft studio light, premium baby clothing catalog, warm neutral background, no text', 'portrait_4_3'),
  cat6: imgUrl('Studio product photograph of a pair of beige children winter ankle boots with small bow details, placed on a warm knitted blanket, premium kids footwear catalog, soft light, no text', 'portrait_4_3'),

function confirmRedeem(id) {
  const item = REDEEM_ITEMS.find((x) => x.id === id);
  if (!item) return;
  // 每人限兑 1 件 + 积分/库存双重校验，与服务端事务校验保持一致
  if (state.redeemed[id]) { closeSheet(); showToast('该礼品每人限兑 1 件'); return; }
  if (state.points < item.points) { closeSheet(); showToast('积分不足，去签到赚积分吧'); return; }
  if (item.stock <= 0) { closeSheet(); showToast('该礼品已兑完'); return; }
  const code = String(Math.floor(100000 + Math.random() * 900000));
  const no = 'RD' + new Date().toISOString().slice(0, 10).replace(/-/g, '') + String(REDEEM_RECORDS.length + 1).padStart(4, '0');
  state.points -= item.points;
  item.stock -= 1;
  state.redeemed[id] = true;
  state.redeemCount += 1;
  REDEEM_RECORDS.unshift({ no, name:item.name, points:item.points, code, status:'pending', date:'今天 09:32', exp:'30 天内有效' });
  POINT_LOGS.unshift({ t:'积分兑换 · ' + item.name, d:'今天 09:32', v:'-' + item.points.toLocaleString('zh-CN'), type:'out' });
  goTab('discover');
  showRedeemSuccess(item, code);
}

<script>

function openSheet(html) {

  document.getElementById('mp-sheet-mask').classList.remove('open');

function showToast(msg) {
  let t = document.getElementById('mp-toast');
  if (!t) {
    t = document.createElement('div');
    t.id = 'mp-toast';
    t.style.cssText = 'position:absolute;left:50%;bottom:96px;transform:translateX(-50%) translateY(6px);background:rgba(24,24,27,.94);color:#fff;font-size:12px;padding:9px 14px;border-radius:9px;z-index:80;opacity:0;transition:all .2s;pointer-events:none;white-space:nowrap;max-width:78%;text-align:center;';
    document.querySelector('.screen').appendChild(t);
  }
  t.textContent = msg;
  requestAnimationFrame(() => { t.style.opacity = '1'; t.style.transform = 'translateX(-50%)'; });
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; t.style.transform = 'translateX(-50%) translateY(6px)'; }, 2000);
}

  document.getElementById('mp-tabbar').innerHTML = TABS.map((t) => `

    </div>
    <div class="mp-card mt-3 p-3">
      <p class="text-[11px] font-medium">抽奖规则</p>
      <div class="mt-2 space-y-1 text-[10px] leading-relaxed text-[#71717a]">
        <p>1. 每次消耗 10 积分，每日最多 5 次；</p>
        <p>2. 积分奖品实时到账，优惠券自动放入「我的优惠券」；</p>
        <p>3. 抽奖结果以服务端记录为准，不支持撤销。</p>
      </div>
    </div>
    <p class="mt-4 text-center text-[10px] text-[#a1a1aa]">DaveBella · 把柔软穿进童年</p>
  </div>`;
}

// 按权重抽奖（正式版由服务端返回结果，前端只负责把转盘停在对应扇区）
function pickPrize() {
  const total = DRAW_POOL.reduce((sum, item) => sum + item.weight, 0);
  let roll = Math.random() * total;
  let result = DRAW_POOL[DRAW_POOL.length - 1];
  for (const item of DRAW_POOL) {
    roll -= item.weight;
    if (roll <= 0) { result = item; break; }
  }
  return result;
}

function spinWheel() {
  if (wheelSpinning) return;
  if (state.points < 10) { showToast('积分不足，去签到赚积分吧'); return; }
  const wheel = document.getElementById('wheel');
  const btn = document.getElementById('wheel-btn');
  if (!wheel) return;

  wheelSpinning = true;
  if (btn) btn.disabled = true;

  const result = pickPrize();
  const index = PRIZES.indexOf(result.prize);
  // 让中奖扇区中心停在顶部指针处，并额外转 5 圈
  const target = ((360 - index * 60) % 360 + 360) % 360;
  const current = ((wheelRot % 360) + 360) % 360;
  wheelRot += 360 * 5 + ((target - current + 360) % 360);
  wheel.style.transform = `rotate(${wheelRot}deg)`;

  state.points -= 10;
  POINT_LOGS.unshift({ t:'积分抽奖 · 消耗', d:'今天 09:30', v:'-10', type:'out' });
  if (result.type === 'points') state.points += result.value;
  if (result.type === 'coupon') state.couponCount += 1;
  DRAW_RECORDS.unshift({ prize: result.prize, time:'今天 09:30', cost:'-10 积分', win: result.type !== 'none' });

  // 4s 与 .wheel 过渡时长一致，转完再弹结果
  setTimeout(() => {
    wheelSpinning = false;
    if (btn) btn.disabled = false;
    const pointsEl = document.getElementById('draw-points');
    if (pointsEl) pointsEl.textContent = state.points.toLocaleString('zh-CN');
    showDrawResult(result);
  }, 4100);
}

function showDrawResult(result) {
  const win = result.type !== 'none';
  openSheet(`
    <div class="mx-auto mb-3 h-1 w-9 rounded-full bg-[#e4e4e7]"></div>
    <div class="py-4 text-center">
      <div class="mx-auto flex h-20 w-20 items-center justify-center rounded-full" style="background:${win ? '#fff1f2' : '#f4f4f5'};color:${win ? '#ff0f23' : '#a1a1aa'}">
        ${icon(win ? 'party-popper' : 'meh', 'h-9 w-9')}
      </div>
      <p class="mt-4 text-[15px] font-semibold">${win ? '恭喜中奖' : '差一点点'}</p>
      <p class="mt-2 text-[20px] font-semibold" style="color:${win ? '#ff0f23' : '#71717a'}">${result.prize}</p>
      <p class="mt-1 text-[10px] text-[#a1a1aa]">${result.type === 'points' ? '积分已自动到账' : result.type === 'coupon' ? '优惠券已放入「我的优惠券」' : '再接再厉，下次好运'}</p>
      <div class="mt-5 flex gap-2">
        <button class="btn flex-1" onclick="closeSheet()">收下</button>
        <button class="btn btn-primary flex-1" onclick="closeSheet();setTimeout(spinWheel, 120)">再抽一次</button>
      </div>
    </div>
  `);
}

      <div class="mt-4 space-y-3">

        </div>

        </div>
        <div>
          <p class="mb-1 text-[11px] text-[#52525b]">手机号</p>
          <input class="field tnum" value="${state.phone}" readonly />
        </div>
        <div>
          <p class="mb-1 text-[11px] text-[#52525b]">会员等级</p>
          <input class="field" value="${state.level}" readonly />
        </div>
      </div>
      <button class="btn btn-primary mt-5 w-full" style="height:42px" onclick="saveProfile()">保存修改</button>
      <p class="mt-3 text-center text-[9px] text-[#a1a1aa]">保存后立即生效，会员资产与积分不受影响</p>

}

function saveProfile() {
  const nameEl = document.getElementById('edit-name');
  const birthEl = document.getElementById('edit-birthday');
  const name = (nameEl ? nameEl.value : '').trim();
  if (!name) { showToast('昵称不能为空'); return; }
  state.name = name.slice(0, 16);
  if (birthEl && birthEl.value) state.birthday = birthEl.value;
  closeSubPage();
  showToast('资料已更新');
}
