<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>DaveBella 桌面端 · 原型</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="./demo.css" />
<script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
</head>
<body>
<div class="h-screen w-screen p-2.5">
  <div id="app-shell" class="relative flex h-full overflow-hidden rounded-xl border border-[#d4d4d8] bg-white shadow-[0_20px_60px_rgba(0,0,0,.18)]">

    <!-- 左侧导航 -->
    <aside class="flex w-[78px] shrink-0 flex-col items-center border-r border-[#e4e4e7] bg-white pt-9">
      <button class="mb-5 flex h-9 w-9 items-center justify-center" title="Dave &amp; Bella" onclick="go('analysis')">
        <svg viewBox="0 0 1024 1024" width="32" height="32" xmlns="http://www.w3.org/2000/svg" aria-label="Dave &amp; Bella">
          <path fill="#4f46e5" d="M721.419424 204.785372h54.853225c71.309192 0 134.280694 54.633812 142.618384 123.968288l67.579173 561.404472c8.776516 72.771945-46.588672 133.768731-121.335333 133.76873H158.771613C83.878677 1023.926862 28.732902 963.003214 37.43628 890.231269L105.088591 328.387972c8.264553-68.89565 71.455467-123.6026 142.472109-123.6026h54.926362v-0.146275C302.487062 91.641454 396.395783 0 511.953243 0c115.55746 0 209.466181 91.860867 209.466181 204.639097V204.785372z m-352.742804 0h175.676595c24.354832 0 44.101993 19.308335 44.101992 43.151204 0 23.769731-19.747161 43.078066-44.101992 43.078066H368.67662v98.735804a53.317334 53.317334 0 0 1 19.747161 41.395901 54.487537 54.487537 0 0 1-55.072638 53.902435 54.487537 54.487537 0 0 1-55.145775-53.902435c0-18.576959 9.654168-34.959789 24.281694-44.613956V290.941504h-54.926362c-26.329548 0-51.854582 22.014428-54.853225 47.466324L125.055165 900.324263c-2.559817 21.575602 11.702021 37.37333 33.716448 37.37333h706.36326c21.94129 0 36.276266-15.870866 33.643311-37.519606l-67.506035-561.404471c-3.071781-25.817584-28.377402-47.758874-54.926362-47.758874h-54.853225v98.735804a53.317334 53.317334 0 0 1 19.747161 41.395901 54.487537 54.487537 0 0 1-55.072638 53.902435 54.487537 54.487537 0 0 1-55.145775-53.902435c0-18.576959 9.654168-34.959789 24.281694-44.613956V204.56596C655.303004 127.552032 590.941887 64.653668 511.953243 64.653668s-143.349761 62.752089-143.34976 139.985429V204.785372zM293.27172 611.064924c0-1.755303 0-3.510606-1.901578-3.510606a46.296122 46.296122 0 0 1 13.018499-24.793658l126.528105-113.143918a47.027498 47.027498 0 0 1 59.460895 0 34.374688 34.374688 0 0 1 0 53.024784l-52.073994 46.003571h270.828655c24.135419 0 44.613956 17.699307 44.613956 38.909221 0 21.209914-20.478537 38.909221-44.613956 38.90922H334.155657a42.127277 42.127277 0 0 1-27.865438-10.604956c-7.460039-7.09435-13.018499-15.944004-13.018499-24.793658z m460.474538 119.653168c0 1.755303 0 3.510606 1.901578 1.755303a46.296122 46.296122 0 0 1-13.018498 24.793657L616.101233 870.337833a47.027498 47.027498 0 0 1-59.534034 0 34.374688 34.374688 0 0 1 0-53.024784l52.073995-44.248268H337.885677c-24.135419 0-44.613956-17.699307-44.613957-38.909221 0-21.209914 20.478537-38.909221 44.613957-38.90922h374.976644c9.288479 0 20.478537 3.583744 27.865438 10.604956 7.460039 7.09435 13.018499 15.944004 13.018499 24.793658z"></path>
        </svg>
      </button>
      <nav id="rail" class="flex flex-col items-center gap-1"></nav>
      <div class="flex-1"></div>
      <button class="mb-4 flex h-9 w-9 items-center justify-center rounded-lg text-[#71717a] transition hover:bg-[#f4f4f5] hover:text-[#18181b]" title="设置" onclick="openDialog('settings')"><i data-lucide="settings" class="h-[18px] w-[18px]"></i></button>
    </aside>

    <!-- 主区域 -->
    <div class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-14 shrink-0 items-center gap-3 border-b border-[#e4e4e7] px-5">
        <div class="flex shrink-0 flex-col justify-center leading-none">
          <span class="text-[15px] font-semibold tracking-[-0.01em]">Dave &amp; Bella</span>
          <span class="mt-1 text-[10px] text-[#a1a1aa]">v1.0.0</span>
        </div>
        <span class="h-7 w-px shrink-0 bg-[#e4e4e7]"></span>
        <div class="min-w-0">
          <h1 id="page-title" class="truncate text-[15px] font-semibold">经营分析</h1>
          <p id="page-sub" class="truncate text-[11px] text-[#71717a]">左任务、右对话，产物可预览</p>
        </div>

        <div class="ml-auto flex items-center gap-2">
          <button class="btn btn-sm btn-ghost" title="刷新"><i data-lucide="refresh-cw" class="h-4 w-4"></i></button>
          <div class="relative">
            <button id="notif-trigger" class="btn btn-sm btn-ghost relative" title="消息" onclick="event.stopPropagation();toggleNotif()">
              <i data-lucide="bell" class="h-4 w-4"></i>
              <span id="notif-dot" class="absolute right-1.5 top-1.5 h-1.5 w-1.5 rounded-full bg-[#dc2626]"></span>
            </button>
            <div id="notif-menu" class="absolute right-0 top-11 z-50 hidden w-[336px] overflow-hidden rounded-xl border border-[#e4e4e7] bg-white shadow-xl"></div>
          </div>
          <div class="relative">
            <button id="user-trigger" class="flex items-center gap-2 rounded-lg py-1 pl-1 pr-2 hover:bg-[#f4f4f5]">
              <i data-lucide="circle-user-round" class="h-[18px] w-[18px] text-[#71717a]"></i>
              <span class="text-xs font-medium">林晓</span>
              <i data-lucide="chevron-down" class="h-3 w-3 text-[#71717a]"></i>
            </button>
            <div id="user-menu" class="absolute right-0 top-11 z-50 hidden w-[196px] overflow-hidden rounded-xl border border-[#e4e4e7] bg-white p-1 shadow-xl">
              <div class="px-3 py-2">
                <p class="text-xs font-semibold">林晓</p>
                <p class="mt-0.5 text-[11px] text-[#71717a]">店长 · Dave &amp; Bella</p>
              </div>
              <div class="my-1 h-px bg-[#e4e4e7]"></div>
              <button class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-xs hover:bg-[#f4f4f5]" onclick="openDialog('oplog')"><i data-lucide="scroll-text" class="h-4 w-4 text-[#71717a]"></i>操作日志</button>
              <button class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-xs hover:bg-[#f4f4f5]" onclick="openDialog('settings')"><i data-lucide="settings" class="h-4 w-4 text-[#71717a]"></i>系统设置</button>
              <button class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-xs hover:bg-[#f4f4f5]" onclick="openDialog('password')"><i data-lucide="key-round" class="h-4 w-4 text-[#71717a]"></i>修改密码</button>
              <div class="my-1 h-px bg-[#e4e4e7]"></div>
              <button class="flex w-full items-center gap-2 rounded-md px-3 py-2 text-xs text-[#dc2626] hover:bg-[#fef2f2]" onclick="openDialog('logout')"><i data-lucide="log-out" class="h-4 w-4"></i>退出登录</button>
            </div>
          </div>
        </div>
      </header>

      <main id="page-root" class="relative min-h-0 flex-1 overflow-hidden"></main>
    </div>
  </div>
</div>

<!-- 登录 / 注册 -->
<div id="auth-screen" class="fixed inset-0 z-[90] flex bg-white">
  <div class="relative hidden w-[52%] flex-col justify-between overflow-hidden bg-[#4f46e5] p-10 text-white lg:flex">
    <div class="pointer-events-none absolute -right-24 -top-24 h-[420px] w-[420px] rounded-full bg-white/10"></div>
    <div class="pointer-events-none absolute -bottom-32 -left-20 h-[380px] w-[380px] rounded-full bg-white/5"></div>
    <div class="relative flex items-center gap-3">
      <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-white">
        <svg viewBox="0 0 1024 1024" width="24" height="24" xmlns="http://www.w3.org/2000/svg" aria-label="Dave &amp; Bella">
          <path fill="#4f46e5" d="M721.419424 204.785372h54.853225c71.309192 0 134.280694 54.633812 142.618384 123.968288l67.579173 561.404472c8.776516 72.771945-46.588672 133.768731-121.335333 133.76873H158.771613C83.878677 1023.926862 28.732902 963.003214 37.43628 890.231269L105.088591 328.387972c8.264553-68.89565 71.455467-123.6026 142.472109-123.6026h54.926362v-0.146275C302.487062 91.641454 396.395783 0 511.953243 0c115.55746 0 209.466181 91.860867 209.466181 204.639097V204.785372z m-352.742804 0h175.676595c24.354832 0 44.101993 19.308335 44.101992 43.151204 0 23.769731-19.747161 43.078066-44.101992 43.078066H368.67662v98.735804a53.317334 53.317334 0 0 1 19.747161 41.395901 54.487537 54.487537 0 0 1-55.072638 53.902435 54.487537 54.487537 0 0 1-55.145775-53.902435c0-18.576959 9.654168-34.959789 24.281694-44.613956V290.941504h-54.926362c-26.329548 0-51.854582 22.014428-54.853225 47.466324L125.055165 900.324263c-2.559817 21.575602 11.702021 37.37333 33.716448 37.37333h706.36326c21.94129 0 36.276266-15.870866 33.643311-37.519606l-67.506035-561.404471c-3.071781-25.817584-28.377402-47.758874-54.926362-47.758874h-54.853225v98.735804a53.317334 53.317334 0 0 1 19.747161 41.395901 54.487537 54.487537 0 0 1-55.072638 53.902435 54.487537 54.487537 0 0 1-55.145775-53.902435c0-18.576959 9.654168-34.959789 24.281694-44.613956V204.56596C655.303004 127.552032 590.941887 64.653668 511.953243 64.653668s-143.349761 62.752089-143.34976 139.985429V204.785372zM293.27172 611.064924c0-1.755303 0-3.510606-1.901578-3.510606a46.296122 46.296122 0 0 1 13.018499-24.793658l126.528105-113.143918a47.027498 47.027498 0 0 1 59.460895 0 34.374688 34.374688 0 0 1 0 53.024784l-52.073994 46.003571h270.828655c24.135419 0 44.613956 17.699307 44.613956 38.909221 0 21.209914-20.478537 38.909221-44.613956 38.90922H334.155657a42.127277 42.127277 0 0 1-27.865438-10.604956c-7.460039-7.09435-13.018499-15.944004-13.018499-24.793658z m460.474538 119.653168c0 1.755303 0 3.510606 1.901578 1.755303a46.296122 46.296122 0 0 1-13.018498 24.793657L616.101233 870.337833a47.027498 47.027498 0 0 1-59.534034 0 34.374688 34.374688 0 0 1 0-53.024784l52.073995-44.248268H337.885677c-24.135419 0-44.613956-17.699307-44.613957-38.909221 0-21.209914 20.478537-38.909221 44.613957-38.90922h374.976644c9.288479 0 20.478537 3.583744 27.865438 10.604956 7.460039 7.09435 13.018499 15.944004 13.018499 24.793658z"></path>
        </svg>
      </span>
      <span class="text-[17px] font-semibold tracking-[-0.01em]">Dave &amp; Bella</span>
    </div>
    <div class="relative max-w-[420px]">
      <p class="text-[30px] font-semibold leading-[1.25]">懂我，帮我的<br />经营伙伴</p>
      <p class="mt-4 text-[13px] leading-relaxed text-white/70">经营分析、订单、库存、会员、营销与数据，一个工作台完成门店每天的经营闭环。</p>
      <div class="mt-8 space-y-3 text-[12px] text-white/80">
        <div class="flex items-center gap-2"><i data-lucide="sparkles" class="h-4 w-4"></i>定时生成日报 / 周报 / 月报</div>
        <div class="flex items-center gap-2"><i data-lucide="database" class="h-4 w-4"></i>数据可追溯，口径统一</div>
        <div class="flex items-center gap-2"><i data-lucide="shield-check" class="h-4 w-4"></i>单店经营，权限清晰</div>
      </div>
    </div>
    <p class="relative text-[11px] text-white/50">v1.0.0 · 单店版</p>
  </div>
  <div class="flex flex-1 flex-col bg-[#fafafa]">
    <div class="flex justify-end px-6 pt-5">
      <span class="text-[11px] text-[#a1a1aa]">DaveBella v1.0.0</span>
    </div>
    <div class="flex flex-1 items-center justify-center px-6 pb-10">
      <div id="auth-panel" class="w-full max-w-[360px]"></div>
    </div>
  </div>
</div>

<div id="dialog-mask" class="dialog-mask" onclick="if(event.target===this)closeDialog()">
  <div id="dialog" class="dialog"></div>
</div>
<div id="toast" class="toast"><i data-lucide="check-circle-2" class="h-4 w-4 text-[#4ade80]"></i><span id="toast-text">已完成</span></div>

<script>
/* ================= 数据 ================= */
// 任务分组（从上到下：经营分析 / 自由对话 / 归档任务）
const TASK_GROUPS = [
  {
    id:'analysis', label:'经营分析', note:'定时自动生成, 完成后消息通知',
    items:[
      { id:'t1', title:'店铺经营日报', icon:'sun', schedule:'每晚 21:20', status:'done', time:'今天 21:20', range:'10/23', active:true },
      { id:'t2', title:'店铺经营周报', icon:'calendar-check', schedule:'每周一 10:10', status:'done', time:'10/19 10:10', range:'10/12 - 10/18' },
      { id:'t3', title:'店铺经营月报', icon:'calendar-range', schedule:'每月 1 日 10:20', status:'done', time:'10/01 10:20', range:'09/01 - 09/30' },
    ]
  },
  {
    id:'free', label:'自由对话', note:'随问随答，不设周期',
    items:[
      { id:'f1', title:'今日经营追问：补货建议', icon:'message-square', status:'running', time:'今天 16:05', range:'今天' },
      { id:'f2', title:'库存健康诊断', icon:'package-search', status:'done', time:'昨天 20:10', range:'近 30 天' },
      { id:'f3', title:'会员复购分析', icon:'users', status:'done', time:'昨天 20:10', range:'近 90 天' },
      { id:'f4', title:'分析昨天退款订单', icon:'search', status:'failed', time:'10/21', range:'10/20' },
    ]
  },
  {
    id:'archive', label:'归档任务', note:'已归档的历史任务',
    items:[
      { id:'a1', title:'国庆活动复盘', icon:'megaphone', status:'done', time:'10/08', range:'09/28 - 10/07' },
      { id:'a2', title:'09 月第二周经营周报', icon:'calendar-check', status:'done', time:'09/14', range:'09/07 - 09/13' },
    ]
  },
];
const ALL_TASKS = () => TASK_GROUPS.reduce((a,g)=>a.concat(g.items), []);

// 消息通知（右上角铃铛）
const NOTIFS = [
  { id:'n1', title:'店铺经营日报已生成', desc:'2026-10-23 · 含异常提醒与明日建议', time:'今天 21:20', task:'t1', unread:true },
  { id:'n2', title:'店铺经营周报已生成', desc:'10/12 - 10/18 · 上周经营周报', time:'10/19 10:10', task:'t2', unread:true },
  { id:'n3', title:'店铺经营月报已生成', desc:'09/01 - 09/30 · 上月经营月报', time:'10/01 10:20', task:'t3', unread:true },
];

const NAV = [
  { id:'analysis', label:'AI经营', icon:'sparkles' },
  { id:'buy', label:'买单', icon:'scan-line' },
  { id:'orders', label:'订单', icon:'receipt-text' },
  { id:'inventory', label:'库存', icon:'package' },
  { id:'members', label:'会员', icon:'users' },
  { id:'marketing', label:'营销', icon:'megaphone' },
  { id:'data', label:'数据', icon:'chart-column' },
];

const PAGE_META = {
  analysis: ['经营分析','左任务、右对话，产物可预览'],
  buy: ['买单','扫码开单 · 会员权益 · 多支付方式'],
  orders: ['订单中心','查询、退换货、对账；导出在商品明细抽屉'],
  inventory: ['库存中心','库存、流水、断码与热销'],
  members: ['会员中心','会员画像、积分、余额与优惠券'],
  marketing: ['营销中心','活动名称、时间与类型筛选，活动效果与核销'],
  data: ['数据中心','事实数据看板，不含 AI 与导购业绩'],
};

const state = { page:'analysis', artifactOpen:false, selectedArtifact:'report', taskId:'t1', collapsed:{} };

/* ================= 页面渲染 ================= */
function renderRail(){
  document.getElementById('rail').innerHTML = NAV.map(n => `
    <button class="rail-btn ${state.page===n.id?'active':''}" onclick="go('${n.id}')" title="${n.label}">
      <i data-lucide="${n.icon}"></i><span>${n.label}</span>
    </button>`).join('');
}

function go(page){
  state.page = page;
  const [title, sub] = PAGE_META[page];
  document.getElementById('page-title').textContent = title;
  document.getElementById('page-sub').textContent = sub;
  renderRail();
  const root = document.getElementById('page-root');
  root.innerHTML = ({
    analysis: analysisPage, buy: buyPage, orders: ordersPage,
    inventory: inventoryPage, members: membersPage, marketing: marketingPage, data: dataPage
  })[page]();
  lucide.createIcons();
  renderNotifBadge();
  if(page==='analysis' && state.artifactOpen) openArtifact(state.selectedArtifact, false);
}

/* ---------- 经营分析 ---------- */
function taskItem(t){
  const color = t.status==='running' ? 'bg-[#4f46e5]' : t.status==='failed' ? 'bg-[#dc2626]' : 'bg-[#16a34a]';
  const sel = state.taskId===t.id;
  return `
  <button class="group w-full rounded-lg px-3 py-2.5 text-left ${sel?'bg-[#f4f4f5]':'hover:bg-[#fafafa]'}" onclick="selectTask('${t.id}')">
    <div class="flex items-center gap-2">
      <span class="dot ${color} ${t.status==='running'?'animate-pulse':''}"></span>
      <span class="flex-1 truncate text-[13px] font-medium">${t.title}</span>
      <span class="shrink-0 text-[10px] text-[#a1a1aa]">${t.time}</span>
    </div>
    <div class="mt-1 flex items-center gap-1.5 pl-3.5 text-[11px] text-[#71717a]">
      <i data-lucide="${t.icon}" class="h-3 w-3 shrink-0"></i>
      <span class="truncate">${t.range}</span>
      ${t.status==='running'?'<span class="ml-auto shrink-0 text-[#4f46e5]">运行中</span>':''}
      ${t.status==='failed'?'<span class="ml-auto shrink-0 text-[#dc2626]">失败</span>':''}
    </div>
    ${t.schedule?`<div class="mt-1 flex items-center gap-1 pl-3.5 text-[10px] text-[#a1a1aa]"><i data-lucide="clock" class="h-3 w-3"></i>${t.schedule} 自动执行</div>`:''}
  </button>`;
}

function taskGroups(){
  return TASK_GROUPS.map((g,gi)=>`
    <div class="${gi?'mt-2':''}">
      <div class="flex items-center gap-1 rounded-md px-3 pb-1 pt-2 hover:bg-[#fafafa]">
        <button class="flex min-w-0 flex-1 items-center gap-2 text-left" onclick="toggleGroup('${g.id}')">
          <i data-lucide="${state.collapsed[g.id]?'chevron-right':'chevron-down'}" class="h-3 w-3 shrink-0 text-[#a1a1aa]"></i>
          <span class="text-[10px] font-medium uppercase tracking-wider text-[#a1a1aa]">${g.label}</span>
          <span class="badge">${g.items.length}</span>
        </button>
        ${g.id==='free'?`<button class="btn btn-sm btn-ghost h-5 w-5 p-0" title="新建自由对话" onclick="event.stopPropagation();newFreeTask()"><i data-lucide="plus" class="h-3.5 w-3.5"></i></button>`:''}
      </div>
      ${state.collapsed[g.id]?'':g.items.map(taskItem).join('')}
    </div>`).join('');
}

function newFreeTask(){
  const id = 'f' + Date.now();
  TASK_GROUPS[1].items.unshift({ id, title:'新对话', icon:'message-square', status:'done', time:'刚刚', range:'待确认' });
  state.collapsed.free = false;
  state.taskId = id;
  go('analysis');
  showToast('已新建自由对话');
}

function toggleGroup(id){
  state.collapsed[id] = !state.collapsed[id];
  go('analysis');
}

function currentTask(){
  return ALL_TASKS().find(t=>t.id===state.taskId) || TASK_GROUPS[0].items[0];
}

function analysisPage(){
  const t = currentTask();
  const statusBadge = t.status==='done'
    ? '<span class="badge badge-success"><i data-lucide="check" class="h-3 w-3"></i>已完成</span>'
    : t.status==='running'
      ? '<span class="badge badge-brand"><i data-lucide="loader" class="h-3 w-3 animate-spin"></i>运行中</span>'

          <span class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full ${n.unread?'bg-[#dc2626]':'bg-transparent'}"></span>
          <span class="min-w-0 flex-1">
            <span class="flex items-center gap-2">
              <span class="min-w-0 flex-1 truncate text-[12px] font-medium ${n.unread?'text-[#18181b]':'text-[#71717a]'}">${n.title}</span>
              <span class="shrink-0 text-[10px] text-[#a1a1aa]">${n.time}</span>
            </span>
            <span class="mt-0.5 block truncate text-[11px] text-[#71717a]">${n.desc}</span>
          </span>
        </button>`).join('')}
    </div>
    <div class="border-t border-[#e4e4e7] px-3 py-2">
      <button class="w-full text-center text-[11px] text-[#4f46e5]" onclick="markAllRead()">全部标记为已读</button>
    </div>`;
  lucide.createIcons();
}

function toggleNotif(){
  const menu = document.getElementById('notif-menu');
  if(!menu) return;
  if(menu.classList.contains('hidden')){
    renderNotifMenu();
    menu.classList.remove('hidden');
  } else {
    menu.classList.add('hidden');
  }
}

function openNotif(id){
  const n = NOTIFS.find(x=>x.id===id);
  if(!n) return;
  n.unread = false;
  renderNotifBadge();
  document.getElementById('notif-menu')?.classList.add('hidden');
  state.taskId = n.task;
  go('analysis');
  showToast(`已打开「${n.title}」`);
}

function markAllRead(){
  NOTIFS.forEach(n=>n.unread=false);
  renderNotifBadge();
  renderNotifMenu();
  showToast('消息已全部标记为已读');
}

const DATE_RANGES = {
  orders:    { start:'2026-10-23', end:'2026-10-23', draftStart:null, draftEnd:null, month:8 },
  members:   { start:'2025-05-01', end:'2026-10-23', draftStart:null, draftEnd:null, month:8 },
  marketing: { start:'2026-01-01', end:'2026-10-23', draftStart:null, draftEnd:null, month:8 },
  data:      { start:'2026-09-24', end:'2026-10-23', draftStart:null, draftEnd:null, month:8 },
  oplog:     { start:'2026-10-17', end:'2026-10-23', draftStart:null, draftEnd:null, month:8 },
};
let rangeScope = 'orders';
let rangePopEl = null;
function activePop(){ return rangePopEl || document.getElementById('range-popover'); }

function pad2(n){ return String(n).padStart(2,'0'); }
function rangeOf(scope){ return DATE_RANGES[scope] || DATE_RANGES.orders; }
function rangeLabel(scope){ const r = rangeOf(scope || rangeScope); return `${r.start} → ${r.end}`; }

function calMonth(year, month, r){
  const first = new Date(year, month, 1);
  const days = new Date(year, month + 1, 0).getDate();
  const pad = (first.getDay() + 6) % 7;
  const cells = Array(pad).fill(null);
  for (let d = 1; d <= days; d++) cells.push(`${year}-${pad2(month + 1)}-${pad2(d)}`);
  while (cells.length % 7 !== 0) cells.push(null);
  const week = ['一','二','三','四','五','六','日'];
  const s = r.draftStart || r.start;
  const e = r.draftStart ? (r.draftEnd || r.draftStart) : r.end;
  return `
    <div class="flex-1">
      <p class="text-center text-[11px] font-medium">${year} 年 ${month + 1} 月</p>
      <div class="mt-2 grid grid-cols-7 gap-y-1 text-center">
        ${week.map(w=>`<span class="text-[10px] text-[#a1a1aa]">${w}</span>`).join('')}
        ${cells.map(ds=>{
          if(!ds) return '<span></span>';
          const d = Number(ds.slice(-2));
          const inRange = ds >= s && ds <= e;
          const edge = ds === s || ds === e;
          const today = ds === '2026-10-23';
          return `<button class="relative mx-auto flex h-8 w-8 items-center justify-center rounded-md text-[12px] tnum ${edge?'bg-[#4f46e5] text-white font-medium':inRange?'bg-[#eef2ff] text-[#4338ca]':'hover:bg-[#f4f4f5]'}" onclick="pickRangeDate('${ds}')">${d}${today&&!edge?'<span class="absolute bottom-1 h-1 w-1 rounded-full bg-[#4f46e5]"></span>':''}</button>`;
        }).join('')}
      </div>
    </div>`;
}

function renderRangePopup(){
  const pop = activePop();
  if(!pop) return;
  const r = rangeOf(pop.dataset.scope || rangeScope);
  const y = 2026, m = r.month;
  const m2 = m + 1 > 11 ? 0 : m + 1;
  const y2 = m + 1 > 11 ? y + 1 : y;
  pop.innerHTML = `
    <div class="flex items-center justify-between">
      <p class="text-[12px] font-semibold">选择日期区间</p>
      <div class="flex items-center gap-1">
        <button class="btn btn-sm btn-ghost" onclick="shiftRangeMonth(-1)"><i data-lucide="chevron-left" class="h-4 w-4"></i></button>
        <button class="btn btn-sm btn-ghost" onclick="shiftRangeMonth(1)"><i data-lucide="chevron-right" class="h-4 w-4"></i></button>
      </div>
    </div>
    <div class="mt-3 flex gap-4">
      ${calMonth(y, m, r)}
      <span class="w-px shrink-0 bg-[#e4e4e7]"></span>
      ${calMonth(y2, m2, r)}
    </div>
    <div class="mt-3 flex items-center justify-between border-t border-[#f1f1f3] pt-3">
      <p class="text-[11px] text-[#71717a]">已选：<span class="tnum text-[#18181b]">${r.draftStart || '开始日期'}</span> 至 <span class="tnum text-[#18181b]">${r.draftEnd || r.draftStart || '结束日期'}</span></p>
      <div class="flex gap-2">
        <button class="btn btn-sm" onclick="closeRangePopup()">取消</button>
        <button class="btn btn-sm btn-primary" onclick="applyRange()">确定</button>
      </div>
    </div>`;
  lucide.createIcons();
}

function toggleRangePopup(scope){
  const targetId = scope==='oplog' ? 'oplog-range-popover' : 'range-popover';
  const pop = document.getElementById(targetId);
  if(!pop) return;
  rangePopEl = pop;
  if(scope) { pop.dataset.scope = scope; rangeScope = scope; }
  if(!pop.classList.contains('hidden')){ closeRangePopup(); return; }
  const r = rangeOf(pop.dataset.scope || rangeScope);
  r.draftStart = r.start;
  r.draftEnd = r.end;
  pop.classList.remove('hidden');
  renderRangePopup();
}

function closeRangePopup(){
  activePop()?.classList.add('hidden');
  rangePopEl = null;
}

function shiftRangeMonth(delta){
  const pop = activePop();
  const r = rangeOf(pop?.dataset.scope || rangeScope);
  r.month += delta;
  if(r.month < 0) r.month = 10;
  if(r.month > 10) r.month = 0;
  renderRangePopup();
}

function pickRangeDate(ds){
  const pop = activePop();
  const r = rangeOf(pop?.dataset.scope || rangeScope);
  if(!r.draftStart || r.draftEnd){
    r.draftStart = ds;
    r.draftEnd = null;
  } else if(ds < r.draftStart){
    r.draftStart = ds;
    r.draftEnd = null;
  } else {
    r.draftEnd = ds;
  }
  renderRangePopup();
}

function applyRange(){
  const pop = activePop();
  const scope = pop?.dataset.scope || rangeScope;
  const r = rangeOf(scope);
  if(r.draftStart){
    r.start = r.draftStart;
    r.end = r.draftEnd || r.draftStart;
  }
  const label = document.getElementById(`range-label-${scope}`);
  if(label) label.textContent = rangeLabel(scope);
  closeRangePopup();
  showToast(`已筛选 ${rangeLabel(scope)}`);
}

/** 该款下 SKU 示例：以当前行为基础派生同款其他尺码 */
function styleSkus(r){
  const sizes = ['S','M','L','XL'];
  return sizes.map((size, i) => ({
    sku: `${r.sku.slice(0, -2)}${String(i + 1).padStart(2, '0')}`,
    color: r.color,
    size,
    counts: Math.max(0, r.counts - i * 3),
    saleCounts: Math.max(0, r.saleCounts - i * 2)
  }));
}

const MEMBER_SORT = { key:'', order:'' };
function sortMembers(key){
  if(MEMBER_SORT.key !== key){ MEMBER_SORT.key = key; MEMBER_SORT.order = 'asc'; }
  else if(MEMBER_SORT.order === 'asc'){ MEMBER_SORT.order = 'desc'; }
  else { MEMBER_SORT.key = ''; MEMBER_SORT.order = ''; }

  showToast(MEMBER_SORT.key ? `按${key==='point'?'积分':'余额'}${MEMBER_SORT.order==='asc'?'升序':'降序'}` : '已恢复默认排序');
}

let authMode = 'login';

function authField(label, type, id, placeholder, icon){
  return `<div>
    <label class="mb-1.5 block text-[12px] font-medium" for="${id}">${label}</label>
    <div class="relative">
      <i data-lucide="${icon}" class="pointer-events-none absolute left-3 top-1/2 h-3.5 w-3.5 -translate-y-1/2 text-[#a1a1aa]"></i>
      <input id="${id}" type="${type}" class="input h-10 pl-9" placeholder="${placeholder}" />
    </div>
  </div>`;
}

function renderAuth(){
  const panel = document.getElementById('auth-panel');
  if(!panel) return;
  panel.innerHTML = authMode==='login' ? `
    <div class="fade-in">
      <h2 class="text-[22px] font-semibold tracking-[-0.02em]">登录 DaveBella</h2>
      <p class="mt-1.5 text-[12px] text-[#71717a]">使用门店账号登录经营工作台</p>
      <form class="mt-7 space-y-4" onsubmit="event.preventDefault();doLogin()">
        ${authField('用户名','text','li-username','请输入用户名','user-round')}
        ${authField('密码','password','li-password','请输入密码','lock')}
        <div class="flex items-center justify-between text-[12px]">
          <label class="flex items-center gap-2 text-[#71717a]"><input type="checkbox" class="h-3.5 w-3.5 rounded border-[#d4d4d8] accent-[#4f46e5]" checked />记住我</label>
          <button type="button" class="text-[#4f46e5] hover:underline" onclick="showToast('请联系店长重置密码')">忘记密码？</button>
        </div>
        <button type="submit" class="btn btn-primary h-10 w-full text-[13px]">登录</button>
      </form>
      <p class="mt-5 text-center text-[12px] text-[#71717a]">还没有账号？<button class="font-medium text-[#4f46e5] hover:underline" onclick="setAuthMode('register')">立即注册</button></p>
      <p class="mt-8 rounded-lg bg-white px-3 py-2 text-center text-[11px] text-[#a1a1aa]">原型演示：已预填账号，直接点击「登录」即可进入</p>
    </div>` : `
    <div class="fade-in">
      <h2 class="text-[22px] font-semibold tracking-[-0.02em]">注册账号</h2>
      <p class="mt-1.5 text-[12px] text-[#71717a]">创建门店账号，注册后由店长分配角色权限</p>
      <form class="mt-6 space-y-3" onsubmit="event.preventDefault();doRegister()">
        ${authField('用户名','text','rg-username','4-20 位字母或数字','user-round')}
        ${authField('姓名','text','rg-name','请输入真实姓名','id-card')}
        ${authField('密码','password','rg-password','至少 8 位，建议含字母和数字','lock')}
        ${authField('确认密码','password','rg-confirm','请再次输入密码','lock-keyhole')}
        <p id="auth-error" style="display:none" class="rounded-lg bg-[#fef2f2] px-3 py-2 text-[11px] text-[#dc2626]"></p>
        <button type="submit" class="btn btn-primary h-10 w-full text-[13px]">注册并登录</button>
      </form>
      <p class="mt-4 text-center text-[12px] text-[#71717a]">已有账号？<button class="font-medium text-[#4f46e5] hover:underline" onclick="setAuthMode('login')">返回登录</button></p>
    </div>`;
  if(authMode==='login'){
    const u = document.getElementById('li-username');
    const p = document.getElementById('li-password');
    if(u) u.value = 'linxiao';
    if(p) p.value = '12345678';
  }
  lucide.createIcons();
}

function setAuthMode(mode){
  authMode = mode;
  renderAuth();
}

function doLogin(){
  const user = document.getElementById('li-username');
  const pwd = document.getElementById('li-password');
  if(!user || !pwd) return;
  if(!user.value.trim() || !pwd.value){
    showToast('请输入用户名和密码');
    return;
  }
  enterApp(`欢迎回来，${user.value.trim()}`);
}

function doRegister(){
  const user = document.getElementById('rg-username');
  const name = document.getElementById('rg-name');
  const pwd = document.getElementById('rg-password');
  const confirm = document.getElementById('rg-confirm');
  const err = document.getElementById('auth-error');
  if(!user || !name || !pwd || !confirm || !err) return;
  const fail = msg => {
    err.textContent = msg;
    err.style.display = 'block';
    showToast(msg);
  };
  err.style.display = 'none';
  if(!user.value.trim()) return fail('请输入用户名');
  if(!name.value.trim()) return fail('请输入姓名');
  if(pwd.value.length < 8) return fail('密码至少 8 位');
  if(pwd.value !== confirm.value) return fail('两次输入的密码不一致');
  enterApp(`注册成功，欢迎你，${name.value.trim()}`);
}

function enterApp(msg){
  document.getElementById('auth-screen').classList.add('hidden');
  go('analysis');
  showToast(msg);
}

function logoutToAuth(){
  authMode = 'login';
  renderAuth();
  document.getElementById('auth-screen').classList.remove('hidden');
}

/** 操作日志「操作人」旁的设备信息气泡：点击图标显示系统与版本 */
function toggleDevicePopover(event, trigger, os, version){
  event.stopPropagation();
  const anchor = trigger.getBoundingClientRect();
  const existing = document.getElementById('device-popover');
  const sameAnchor = existing && existing.dataset.anchor === `${anchor.left}-${anchor.top}`;
  if(existing) existing.remove();
  if(sameAnchor) return;

  const card = document.createElement('div');
  card.id = 'device-popover';
  card.dataset.anchor = `${anchor.left}-${anchor.top}`;
  card.className = 'fixed z-[80] w-[208px] rounded-lg border border-[#e4e4e7] bg-white p-3 text-[11px] shadow-xl';
  card.innerHTML = `
    <div class="flex items-center justify-between gap-3"><span class="text-[#71717a]">操作系统</span><span class="text-[#18181b]">${os}</span></div>
    <div class="mt-1.5 flex items-center justify-between gap-3"><span class="text-[#71717a]">客户端版本</span><span class="tnum text-[#18181b]">${version}</span></div>`;
  document.body.appendChild(card);
  card.style.left = `${Math.min(anchor.left, window.innerWidth - 216)}px`;
  card.style.top = `${anchor.bottom + 6}px`;
  // 点击气泡之外的任意位置关闭
  setTimeout(() => document.addEventListener('click', () => card.remove(), { once:true }), 0);
}

/* ================= 交互 ================= */
document.getElementById('user-trigger').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('user-menu').classList.toggle('hidden');
});
document.addEventListener('click', () => {
  document.getElementById('user-menu').classList.add('hidden');
  document.getElementById('notif-menu')?.classList.add('hidden');
});
document.addEventListener('keydown', e => { if(e.key==='Escape'){ closeDialog(); closeArtifact(); } });

let toastTimer;
function showToast(text){
  const el = document.getElementById('toast');
  document.getElementById('toast-text').textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove('show'), 2200);
}

renderAuth();
go('analysis');
</script>
