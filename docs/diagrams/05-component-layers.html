<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>组件分层与依赖方向</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper: #f5f5f5;
      --color-ink: #2d3142;
      --color-muted: #4f5d75;
      --color-accent: #bf4520;
      --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif: 'Instrument Serif', 'Noto Serif', 'Songti SC', serif;
      --font-mono: 'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1060px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    .footnote {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      color: var(--color-muted);
      margin-top: 0.75rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Layer Model · Nova 实施计划</p>
    <h1>桌面端组件分层与依赖方向</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="component-layers-title component-layers-desc">
        <title id="component-layers-title">桌面端组件分层与依赖方向</title>
        <desc id="component-layers-desc">六层组件自下而上为 shadcn/ui 原子组件、AI Elements 对话基元、业务共享组件、应用外壳、业务模块与页面路由，依赖只允许向下；业务共享层是跨模块复用的唯一收口。</desc>
        <defs>
          <marker id="cl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- direction indicator -->
        <path d="M 118,168 V 586" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#cl-arrow)"/>
        <text x="104" y="378" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.16em" transform="rotate(-90 104 378)">DEPENDENCY</text>

        <text x="170" y="132" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.16em">UPPER MAY DEPEND ON LOWER</text>

        <!-- L5 PAGES -->
        <rect x="170" y="150" width="760" height="66" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text x="196" y="190" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">L5</text>
        <text x="240" y="180" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif">Pages · 页面路由</text>
        <text x="240" y="200" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">7 个薄路由 · 只做装配，不写业务逻辑</text>
        <text x="910" y="190" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">PAGES/*</text>

        <!-- L4 FEATURES -->
        <rect x="170" y="228" width="760" height="66" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text x="196" y="268" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">L4</text>
        <text x="240" y="258" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif">Features · 七个业务模块</text>
        <text x="240" y="278" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">analysis · buy · orders · inventory · members · marketing · data</text>
        <text x="910" y="268" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">NO CROSS-IMPORT</text>

        <!-- L3 LAYOUT -->
        <rect x="170" y="306" width="760" height="66" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text x="196" y="346" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">L3</text>
        <text x="240" y="336" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif">Layout · 应用外壳</text>
        <text x="240" y="356" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">AppShell · AppRail · AppHeader · PageHeader · DialogHost</text>
        <text x="910" y="346" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">SHELL</text>

        <!-- L2 BUSINESS COMMON (focal) -->
        <rect x="170" y="384" width="760" height="66" rx="4" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1.2"/>
        <text x="196" y="424" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">L2</text>
        <text x="240" y="414" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif">Business Common · 共享业务组件</text>
        <text x="240" y="434" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">DataTable · FilterBar · DateRangePicker · StatCard · SheetDrawer · PermissionGate</text>
        <text x="910" y="424" fill="#bf4520" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">SEDIMENT</text>

        <!-- L1 AI ELEMENTS -->
        <rect x="170" y="462" width="760" height="66" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text x="196" y="502" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">L1</text>
        <text x="240" y="492" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif">AI Elements · 对话基元</text>
        <text x="240" y="512" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">Conversation · Message · Response · PromptInput · Tool · Reasoning · Plan</text>
        <text x="910" y="502" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">AI-ELEMENTS</text>

        <!-- L0 SHADCN -->
        <rect x="170" y="540" width="760" height="66" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
        <text x="196" y="580" fill="#5a6580" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.12em">L0</text>
        <text x="240" y="570" fill="#2d3142" font-size="15" font-weight="600" font-family="'Geist', 'Noto Sans SC', 'PingFang SC', sans-serif">shadcn/ui · 原子组件</text>
        <text x="240" y="590" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace">button · dialog · sheet · table · tabs · select · calendar · popover · form</text>
        <text x="910" y="580" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.06em">NEW-YORK / NEUTRAL</text>

        <!-- callout -->
        <text x="170" y="676" fill="#4f5d75" font-size="14" font-family="'Instrument Serif', 'Noto Serif', 'Songti SC', serif" font-style="italic">依赖只能向下：两个 feature 需要同一结构时，先把它下沉到 L2，而不是互相 import。</text>
        <text x="170" y="704" fill="#5a6580" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" letter-spacing="0.12em">L0 不自研：shadcn 已有的组件必须 CLI 安装后包一层，禁止用 div / span 复刻</text>
      </svg>
    </div>
    <p class="footnote">NOVA · COMPONENT LAYERS · 2026-10-26</p>
  </div>
</body>
</html>
